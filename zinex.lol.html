<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zinex.lol</title>

<style>
/* ---------------------- FONT ---------------------- */
@font-face {
    font-family: 'ContinuumMedium';
    src: url('ContinuumMedium.woff2') format('woff2'); 
    font-weight: normal;
    font-style: normal;
}

/* ---------------------- ANIMATED GRADIENT BACKGROUND ---------------------- */
@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ---------------------- GLOBAL ---------------------- */
body {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 25%, #0a1a1a 50%, #1a1a0a 75%, #0a0a0a 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    color: #fff;
    font-family: 'ContinuumMedium', sans-serif;
    text-align: center;
    padding-top: 40px;
    margin: 0;
    overflow-x: hidden;
    opacity: 0;
    animation: fadeIn 1.2s ease forwards, gradientShift 15s ease infinite;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

h1 {
    font-size: 48px;
    margin: 20px 0 10px 0;
    cursor: pointer;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    z-index: 10;
    position: relative;
}

/* ---------------------- 3D LOGO WITH LIQUID GLASS ---------------------- */
.interactive-logo {
    width: 250px;
    height: 250px; 
    max-width: 70%;
    margin-bottom: 15px;
    cursor: pointer;
    border-radius: 50%;
    object-fit: cover;
    will-change: transform;
    transition: all 0.3s ease;
    transform-style: preserve-3d;
    
    /* Liquid Glass Effect */
    border: 1px solid rgba(115, 183, 255, 0.3);
    box-shadow: 
        0 1px 8px rgba(0, 0, 0, 0.1),
        0 0 2px rgba(0, 0, 0, 0.1),
        inset 0 0 8px rgba(115, 183, 255, 0.15),
        inset 0 0 0 1px rgba(166, 166, 166, 0.2),
        inset -2px -2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 2px 2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.3);
    
    backdrop-filter: blur(6px) brightness(100%);
    -webkit-backdrop-filter: blur(6px) brightness(100%);
    padding: 8px; 
    background: linear-gradient(135deg, rgba(23, 23, 23, 0.6), rgba(23, 23, 23, 0.6)),
                linear-gradient(135deg, rgba(115, 183, 255, 0.15), rgba(140, 140, 140, 0.15));
    position: relative;
    z-index: 10;
}

.interactive-logo:hover {
    transform: translateY(-8px) scale(1.08) rotateY(10deg);
    box-shadow: 
        0 15px 50px rgba(115, 183, 255, 0.4),
        inset 0 0 30px rgba(115, 183, 255, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.3);
    border-color: rgba(74, 144, 226, 0.5);
}

.interactive-logo:active {
    transform: translateY(-2px) scale(0.98);
}

/* ---------------------- 3D COUNTDOWN WITH LIQUID GLASS ---------------------- */
#countdown-wrapper {
    position: relative;
    display: inline-block;
    perspective: 1000px;
    z-index: 10;
}

#countdown {
    font-size: 42px;
    letter-spacing: 3px;
    margin: 10px 0 30px 0;
    cursor: pointer;
    position: relative;
    text-shadow: 0 0 20px #ff00cc, 0 0 40px #ff0066;
    font-family: 'ContinuumMedium', monospace;
    color: #ffffff;
    padding: 15px 35px;
    border-radius: 100px;
    
    /* Liquid Glass Effect */
    overflow: hidden;
    box-shadow: 
        0 1px 8px rgba(0, 0, 0, 0.1),
        0 0 2px rgba(0, 0, 0, 0.1),
        inset 0 0 8px rgba(242, 242, 242, 0.1),
        inset 0 0 0 1px rgba(166, 166, 166, 0.2),
        inset -2px -2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 2px 2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.3);
    
    backdrop-filter: blur(6px) brightness(100%);
    -webkit-backdrop-filter: blur(6px) brightness(100%);
    background: linear-gradient(135deg, rgba(23, 23, 23, 0.7), rgba(23, 23, 23, 0.7)),
                linear-gradient(135deg, rgba(255, 0, 204, 0.15), rgba(140, 140, 140, 0.15));
    
    will-change: transform;
    transition: all 0.3s ease;
    transform-style: preserve-3d;
    border: 1px solid rgba(255, 0, 204, 0.3);
}

#countdown:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 
        0 10px 40px rgba(255, 0, 204, 0.4),
        inset 0 0 0 1px rgba(255, 255, 255, 0.3);
}

#countdown:active {
    transform: translateY(0px) scale(0.95);
}

#countdown::after {
    content: "🌸";
    position: absolute;
    right: -60px;
    top: -10px;
    font-size: 32px;
    animation: blossomFloat 3s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
}

@keyframes blossomFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* ---------------------- BACKGROUND FIGURES (BLOSSOMS) ---------------------- */
.blossom {
    position: fixed;
    font-size: 24px;
    pointer-events: none;
    z-index: 1;
    opacity: 0.8;
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.6));
}

@keyframes blossomFall {
    0%   { transform: translateY(-50px) rotate(0); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

/* ---------------------- LIQUID GLASS BUTTONS ---------------------- */
.nav-tabs {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 15px;
  z-index: 10000;
}

.action-btn {
    background: linear-gradient(135deg, rgba(23, 23, 23, 0.7), rgba(23, 23, 23, 0.7)),
                linear-gradient(135deg, rgba(115, 183, 255, 0.15), rgba(140, 140, 140, 0.15));
    backdrop-filter: blur(6px) brightness(100%);
    -webkit-backdrop-filter: blur(6px) brightness(100%);
    
    color: #fff;
    border: 1px solid rgba(115, 183, 255, 0.3);
    padding: 12px 24px;
    cursor: pointer;
    font-family: 'ContinuumMedium', sans-serif;
    font-size: 14px;
    border-radius: 100px;
    transition: all 0.3s ease;
    overflow: hidden;
    
    /* Liquid Glass Shadow */
    box-shadow: 
        0 1px 8px rgba(0, 0, 0, 0.1),
        0 0 2px rgba(0, 0, 0, 0.1),
        inset 0 0 8px rgba(242, 242, 242, 0.1),
        inset 0 0 0 1px rgba(166, 166, 166, 0.2),
        inset -2px -2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 2px 2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.3);
}

.action-btn:hover {
    transform: translateY(-3px);
    box-shadow: 
        0 5px 20px rgba(115, 183, 255, 0.4),
        inset 0 0 0 1px rgba(255, 255, 255, 0.3);
    background: linear-gradient(135deg, rgba(40, 40, 40, 0.8), rgba(40, 40, 40, 0.8)),
                linear-gradient(135deg, rgba(115, 183, 255, 0.25), rgba(140, 140, 140, 0.2));
    border-color: rgba(255, 255, 255, 0.4);
}

.action-btn:active {
    transform: translateY(-1px);
}

/* ---------------------- IMPROVED LIQUID GLASS PANEL ---------------------- */
.tilt-container {
    perspective: 1000px;
    margin: 40px auto;
    max-width: 500px;
    width: 90%;
    z-index: 10;
    position: relative;
}

.info-panel {
    background: linear-gradient(135deg, rgba(23, 23, 23, 0.6), rgba(23, 23, 23, 0.6)),
                linear-gradient(135deg, rgba(115, 183, 255, 0.1), rgba(140, 140, 140, 0.1));
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    padding: 30px;
    
    /* Enhanced Liquid Glass Shadow */
    box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.5),
        0 1px 8px rgba(0, 0, 0, 0.1),
        0 0 2px rgba(0, 0, 0, 0.1),
        inset 0 0 8px rgba(242, 242, 242, 0.08),
        inset 0 0 0 1px rgba(166, 166, 166, 0.15),
        inset -2px -2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 2px 2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.2);
    
    will-change: transform;
    transform-style: preserve-3d;
    transition: all 0.3s ease;
}

.panel-header h2 {
    color: #73b7ff;
    font-size: 26px;
    margin: 0 0 20px 0;
    text-shadow: 0 0 15px rgba(115, 183, 255, 0.6);
}

.info-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
}

.info-item:hover {
    background: rgba(255, 255, 255, 0.05);
    padding-left: 10px;
    padding-right: 10px;
    border-radius: 8px;
    transition: 0.3s;
}

.label { color: #ddd; font-weight: bold; }
.value { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.4); }

/* ---------------------- SOCIAL BUTTONS WITH LIQUID GLASS ---------------------- */
.social-buttons {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
}

.social-btn {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(23, 23, 23, 0.6), rgba(23, 23, 23, 0.6)),
                linear-gradient(135deg, rgba(115, 183, 255, 0.1), rgba(140, 140, 140, 0.1));
    backdrop-filter: blur(6px) brightness(100%);
    -webkit-backdrop-filter: blur(6px) brightness(100%);
    
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    border: 1px solid rgba(115, 183, 255, 0.3);
    
    /* Liquid Glass Shadow */
    box-shadow: 
        0 1px 8px rgba(0, 0, 0, 0.1),
        0 0 2px rgba(0, 0, 0, 0.1),
        inset 0 0 8px rgba(242, 242, 242, 0.1),
        inset 0 0 0 1px rgba(166, 166, 166, 0.2),
        inset -2px -2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 2px 2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.3);
}

.social-btn:hover {
    transform: translateY(-5px) scale(1.1);
    background: linear-gradient(135deg, rgba(115, 183, 255, 0.8), rgba(115, 183, 255, 0.8)),
                linear-gradient(135deg, rgba(140, 140, 140, 0.2), rgba(115, 183, 255, 0.2));
    box-shadow: 
        0 0 25px rgba(115, 183, 255, 0.9),
        inset 0 0 0 1px rgba(255, 255, 255, 0.4);
    border-color: rgba(255, 255, 255, 0.5);
}

.social-btn img {
    width: 22px;
    height: 22px;
    filter: brightness(0) invert(1);
}

/* ---------------------- USAGI & PEAM ---------------------- */
#usagi {
    position: fixed;
    bottom: -350px;
    right: 20px;
    width: 200px;
    z-index: 9999;
    transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}
.slide-up { transform: translateY(-350px); }
.slide-down { transform: translateY(350px); }

/* ---------------------- MUSIC OVERLAY ---------------------- */
#musicOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100000;
    cursor: pointer;
    transition: opacity 0.8s ease;
}

.music-content h1 {
    font-size: 2.5rem;
    animation: pulseText 2s ease-in-out infinite;
}

@keyframes pulseText {
    0%, 100% { opacity: 0.8; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 30px #ff00cc; }
}

body:not(.music-started) .main-content {
    opacity: 0.1;
    filter: blur(5px);
    pointer-events: none;
    transition: all 1s ease;
}

body.music-started .main-content {
    opacity: 1;
    filter: blur(0);
    pointer-events: all;
}

/* ---------------------- VISUALIZER ---------------------- */
#canvasVisualizer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 1;
}

/* ---------------------- RESPONSIVE DESIGN ---------------------- */

/* =====================================================
   DYNAMIC ISLAND MUSIC PLAYER
   ===================================================== */

/* --- Wrapper: always fixed top-center --- */
#di-wrapper {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* --- The pill itself --- */
#di-pill {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0a0a0a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    box-shadow:
        0 4px 32px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.06);
    cursor: pointer;
    overflow: hidden;
    user-select: none;

    /* Compact pill dimensions */
    width: 220px;
    height: 48px;
    padding: 0 14px;
    gap: 10px;

    /* Smooth morph */
    transition:
        width  0.55s cubic-bezier(0.34,1.56,0.64,1),
        height 0.55s cubic-bezier(0.34,1.56,0.64,1),
        border-radius 0.45s ease,
        padding 0.45s ease,
        box-shadow 0.3s ease;
    will-change: width, height;
}

/* --- Expanded state --- */
#di-pill.expanded {
    width: min(420px, 92vw);
    height: 180px;
    border-radius: 28px;
    padding: 18px 20px;
    cursor: default;
    box-shadow:
        0 12px 50px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.08);
}

/* ---- COMPACT INNER LAYOUT ---- */
#di-compact {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 10px;
    opacity: 1;
    transition: opacity 0.2s ease;
}
#di-pill.expanded #di-compact {
    opacity: 0;
    pointer-events: none;
    position: absolute;
}

/* Vinyl disk compact */
.di-vinyl {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: repeating-radial-gradient(#333 0, #222 2px, #333 4px);
    border: 1.5px solid rgba(115,183,255,0.5);
    flex-shrink: 0;
    position: relative;
    box-shadow: 0 0 8px rgba(0,0,0,0.6);
}
.di-vinyl::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 8px; height: 8px;
    background: #0a0a0a;
    border-radius: 50%;
    border: 1px solid rgba(115,183,255,0.4);
}
.di-vinyl.rotating { animation: diSpin 3s linear infinite; }
@keyframes diSpin { to { transform: rotate(360deg); } }

/* Track name compact */
.di-track-compact {
    flex: 1;
    font-size: 12px;
    font-family: 'ContinuumMedium', sans-serif;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
}

/* Equalizer bars compact */
.di-eq {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 20px;
    flex-shrink: 0;
}
.di-eq span {
    display: block;
    width: 3px;
    background: #73b7ff;
    border-radius: 2px;
    transition: height 0.1s ease;
}
.di-eq.playing span:nth-child(1) { animation: eqBar 0.7s ease-in-out infinite alternate; }
.di-eq.playing span:nth-child(2) { animation: eqBar 0.5s ease-in-out 0.1s infinite alternate; }
.di-eq.playing span:nth-child(3) { animation: eqBar 0.8s ease-in-out 0.05s infinite alternate; }
.di-eq.playing span:nth-child(4) { animation: eqBar 0.6s ease-in-out 0.15s infinite alternate; }
@keyframes eqBar {
    0%   { height: 3px;  opacity: 0.5; }
    100% { height: 18px; opacity: 1;   }
}
.di-eq:not(.playing) span { height: 4px; opacity: 0.3; }

/* ---- EXPANDED INNER LAYOUT ---- */
#di-expanded {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    gap: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease 0.15s;
}
#di-pill.expanded #di-expanded {
    opacity: 1;
    pointer-events: all;
}

/* Top row: vinyl + track info + close */
.di-exp-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
}

/* Bigger vinyl for expanded */
.di-vinyl-big {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: repeating-radial-gradient(#3a3a3a 0, #222 2px, #3a3a3a 4px);
    border: 2px solid rgba(115,183,255,0.6);
    flex-shrink: 0;
    position: relative;
    box-shadow: 0 0 16px rgba(115,183,255,0.2), 0 0 6px rgba(0,0,0,0.8);
}
.di-vinyl-big::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 13px; height: 13px;
    background: #0a0a0a;
    border-radius: 50%;
    border: 1.5px solid rgba(115,183,255,0.4);
}
.di-vinyl-big.rotating { animation: diSpin 3s linear infinite; }

.di-track-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
}
.di-track-name {
    font-size: 15px;
    font-family: 'ContinuumMedium', sans-serif;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: bold;
}
.di-track-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    font-family: sans-serif;
}

.di-close-btn {
    background: rgba(255,255,255,0.07);
    border: none;
    color: rgba(255,255,255,0.5);
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
}
.di-close-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }

/* Progress bar */
.di-progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
}
.di-time {
    font-size: 10px;
    font-family: monospace;
    color: rgba(255,255,255,0.4);
    min-width: 30px;
    flex-shrink: 0;
}
.di-time:last-child { text-align: right; }

/* Custom range slider */
.di-range {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,0.15);
    cursor: pointer;
    outline: none;
    position: relative;
}
.di-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(115,183,255,0.7);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.di-range::-webkit-slider-thumb:hover {
    transform: scale(1.25);
    box-shadow: 0 0 10px rgba(115,183,255,1);
}
.di-range::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    border: none;
    cursor: pointer;
}

/* Controls row */
.di-controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.di-playback {
    display: flex;
    align-items: center;
    gap: 18px;
}

.di-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.7);
    font-size: 20px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    transition: color 0.2s, transform 0.15s;
    display: flex; align-items: center;
}
.di-btn:hover { color: #fff; transform: scale(1.15); }
.di-btn.play-pause {
    font-size: 26px;
    color: #fff;
    background: rgba(115,183,255,0.15);
    border-radius: 50%;
    width: 42px; height: 42px;
    justify-content: center;
}
.di-btn.play-pause:hover {
    background: rgba(115,183,255,0.3);
    transform: scale(1.08);
}

.di-volume-row {
    display: flex;
    align-items: center;
    gap: 6px;
}
.di-vol-icon { font-size: 13px; color: rgba(255,255,255,0.4); }
.di-vol-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 64px;
    height: 3px;
    border-radius: 3px;
    background: rgba(255,255,255,0.15);
    cursor: pointer;
    outline: none;
}
.di-vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    cursor: pointer;
}

/* Hidden state (before music starts) */
#di-wrapper.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-80px); transition: opacity 0.4s, transform 0.4s; }
#di-wrapper.visible { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); transition: opacity 0.5s ease 0.2s, transform 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.2s; }

/* Notes container full-pill overlay, pointer-events none */
#di-notes-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
    z-index: 100000;
}

/* ---------------------- ПАРТИКЛЫ НОТ ---------------------- */
.note-particle {
    position: absolute;
    /* top/left set dynamically via JS to vinyl center */
    color: #73b7ff;
    font-size: 18px;
    font-family: "Segoe UI Emoji", sans-serif;
    pointer-events: none;
    z-index: 100001;
    opacity: 0;
    
    text-shadow: 0 0 10px rgba(115, 183, 255, 0.8), 0 0 20px rgba(115, 183, 255, 0.4);
    
    animation: floatNote var(--duration) cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}

@keyframes floatNote {
    0% {
        transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
        opacity: 0;
    }
    12% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1) rotate(var(--rStart));
    }
    100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.4) rotate(var(--rEnd));
    }
}

/* ---------------------- САЛЮТ (FIREWORKS) ---------------------- */
#fireworksCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Чтобы можно было кликать сквозь салют */
    z-index: 2; /* Поверх фона, но под текстом */
}
</style>
</head>

<script>
/* ----------------------------------------------------------
   GLOBAL VARIABLES & SETUP
----------------------------------------------------------- */
const musicOverlay = document.getElementById("musicOverlay");
const bgm = document.getElementById("bgm");
const usagi = document.getElementById("usagi");

const chirps = [
    new Audio("chirper1.ogg"),
    new Audio("chirper2.ogg"), 
    new Audio("chirper3.ogg")
];
chirps.forEach(c => { c.preload = "auto"; c.volume = 0.7; });

// Player variables
const songs = [
    { name: "iiSU", src: "zinex.lol_files/iiSU.mp3" },
    { name: "game", src: "zinex.lol_files/game.mp3" },
    { name: "Норм", src: "zinex.lol_files/Норм.mp3" }
];
let currentSongIndex = 0;
let isUserSeeking = false;

/* ----------------------------------------------------------
   DYNAMIC ISLAND ELEMENTS
----------------------------------------------------------- */
const diWrapper       = document.getElementById("di-wrapper");
const diPill          = document.getElementById("di-pill");
const diCompact       = document.getElementById("di-compact");
const diExpanded      = document.getElementById("di-expanded");
const diVinylCompact  = document.getElementById("di-vinyl-compact");
const diVinylBig      = document.getElementById("di-vinyl-big");
const diTrackCompact  = document.getElementById("di-track-compact");
const diTrackName     = document.getElementById("di-track-name");
const diEq            = document.getElementById("di-eq");
const diCurrent       = document.getElementById("di-current");
const diTotal         = document.getElementById("di-total");
const diProgress      = document.getElementById("di-progress");
const diPlayPause     = document.getElementById("di-playpause");
const diPrev          = document.getElementById("di-prev");
const diNext          = document.getElementById("di-next");
const diVolume        = document.getElementById("di-volume");
const diCloseBtn      = document.getElementById("di-close-btn");

let pillExpanded = false;

/* ----------------------------------------------------------
   HELPER FUNCTIONS
----------------------------------------------------------- */
function formatTime(seconds) {
    if (isNaN(seconds) || seconds < 0) return "0:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

function random(min, max) { return Math.random() * (max - min) + min; }

/* Update the visual fill % on a range slider via CSS gradient */
function updateSliderFill(slider) {
    const val = (slider.value - slider.min) / (slider.max - slider.min || 1) * 100;
    slider.style.background = `linear-gradient(to right, rgba(115,183,255,0.9) ${val}%, rgba(255,255,255,0.12) ${val}%)`;
}

/* ----------------------------------------------------------
   PLAYER LOGIC
----------------------------------------------------------- */
function loadTrack(index, autoplay) {
    if (index < 0 || index >= songs.length) index = 0;
    currentSongIndex = index;
    const song = songs[index];

    bgm.src = song.src;
    bgm.load();

    diTrackCompact.textContent = song.name;
    diTrackName.textContent    = song.name;

    // Reset progress UI
    diProgress.value = 0;
    diProgress.max   = 0;
    diCurrent.textContent = "0:00";
    diTotal.textContent   = "0:00";
    updateSliderFill(diProgress);

    if (autoplay) {
        bgm.play().then(() => {
            setPlayingUI(true);
        }).catch(err => console.warn("Playback error:", err));
    }
}

function setPlayingUI(playing) {
    if (playing) {
        diPlayPause.textContent = "⏸";
        diVinylCompact.classList.add("rotating");
        diVinylBig.classList.add("rotating");
        diEq.classList.add("playing");
    } else {
        diPlayPause.textContent = "▶";
        diVinylCompact.classList.remove("rotating");
        diVinylBig.classList.remove("rotating");
        diEq.classList.remove("playing");
    }
}

function togglePlay() {
    if (bgm.paused) {
        bgm.play().catch(e => console.warn(e));
    } else {
        bgm.pause();
    }
}

function nextTrack() { loadTrack((currentSongIndex + 1) % songs.length, true); }
function prevTrack() {
    // If > 3s in, restart; else go to prev
    if (bgm.currentTime > 3) {
        bgm.currentTime = 0;
    } else {
        loadTrack((currentSongIndex - 1 + songs.length) % songs.length, true);
    }
}

/* Audio events */
bgm.addEventListener('play',  () => setPlayingUI(true));
bgm.addEventListener('pause', () => setPlayingUI(false));

bgm.addEventListener('timeupdate', () => {
    if (isUserSeeking) return;
    diProgress.value = bgm.currentTime;
    diCurrent.textContent = formatTime(bgm.currentTime);
    updateSliderFill(diProgress);
});

bgm.addEventListener('loadedmetadata', () => {
    diProgress.max = bgm.duration;
    diTotal.textContent = formatTime(bgm.duration);
    updateSliderFill(diProgress);
});

bgm.addEventListener('ended', () => {
    nextTrack();
});

/* Progress slider seeking fix */
diProgress.addEventListener('mousedown', () => { isUserSeeking = true; });
diProgress.addEventListener('touchstart', () => { isUserSeeking = true; }, { passive: true });

diProgress.addEventListener('input', () => {
    diCurrent.textContent = formatTime(parseFloat(diProgress.value));
    updateSliderFill(diProgress);
});

diProgress.addEventListener('change', () => {
    bgm.currentTime = parseFloat(diProgress.value);
    isUserSeeking = false;
    if (bgm.paused) bgm.play().catch(() => {});
});

diProgress.addEventListener('mouseup', () => {
    bgm.currentTime = parseFloat(diProgress.value);
    isUserSeeking = false;
    if (bgm.paused) bgm.play().catch(() => {});
});

/* Volume slider */
diVolume.addEventListener('input', () => {
    bgm.volume = parseFloat(diVolume.value);
    updateSliderFill(diVolume);
});
updateSliderFill(diVolume);

/* Button wiring */
diPlayPause.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
diNext.addEventListener('click', (e) => { e.stopPropagation(); nextTrack(); });
diPrev.addEventListener('click', (e) => { e.stopPropagation(); prevTrack(); });

/* ----------------------------------------------------------
   DYNAMIC ISLAND EXPAND / COLLAPSE
----------------------------------------------------------- */
function expandPill() {
    pillExpanded = true;
    diPill.classList.add("expanded");
}

function collapsePill() {
    pillExpanded = false;
    diPill.classList.remove("expanded");
}

diCompact.addEventListener('click', (e) => {
    if (!pillExpanded) expandPill();
});

diPill.addEventListener('click', (e) => {
    if (!pillExpanded) expandPill();
});

diCloseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    collapsePill();
});

/* Collapse on outside click */
document.addEventListener('click', (e) => {
    if (pillExpanded && !diPill.contains(e.target)) {
        collapsePill();
    }
});

/* ----------------------------------------------------------
   START EXPERIENCE (music overlay click)
----------------------------------------------------------- */
musicOverlay.addEventListener('click', function () {
    this.style.opacity = '0';
    this.style.pointerEvents = 'none';
    document.body.classList.add("music-started");

    // Show Dynamic Island
    diWrapper.classList.remove("hidden");
    diWrapper.classList.add("visible");

    loadTrack(currentSongIndex, true);
    bgm.volume = parseFloat(diVolume.value);
});

/* ----------------------------------------------------------
   USAGI & INTERACTION
----------------------------------------------------------- */
const logo = document.querySelector(".interactive-logo");
if (usagi && logo) {
    logo.addEventListener("click", function () {
        if (!document.body.classList.contains('music-started')) return;
        
        usagi.classList.remove("slide-down");
        usagi.classList.add("slide-up");

        const chirp = chirps[Math.floor(Math.random() * chirps.length)];
        chirp.currentTime = 0;
        chirp.play().catch(() => {});

        setTimeout(() => {
            usagi.classList.remove("slide-up");
            usagi.classList.add("slide-down");
        }, 4000);
    });
}

function spawnSunEmoji() {
    const el = document.createElement("div");
    const sunEmojis = ["☀️","🌤️","🌞","✨","🌻"];
    el.textContent = sunEmojis[Math.floor(Math.random() * sunEmojis.length)];
    el.style.position = "fixed";
    el.style.fontSize = (40 + Math.random() * 30) + "px";
    el.style.left = (Math.random() * (window.innerWidth - 80)) + "px";
    el.style.top = "-80px";
    el.style.zIndex = 20000;
    el.style.opacity = "1";
    el.style.pointerEvents = "none";
    el.style.transition = "transform 2.2s ease-in, opacity 1s ease-in 1.5s";
    document.body.appendChild(el);

    requestAnimationFrame(() => {
        el.style.transform = `translateY(${window.innerHeight + 200}px) rotate(${Math.random()*60 - 30}deg)`;
        el.style.opacity = "0";
    });

    setTimeout(() => { el.remove(); }, 2500);
}

const cdWrapper = document.getElementById("countdown");
if (cdWrapper) {
    cdWrapper.addEventListener("click", (e) => {
        if (!document.body.classList.contains('music-started')) return;
        e.stopPropagation();
        const burst = 6 + Math.floor(Math.random() * 5);
        for (let i = 0; i < burst; i++) {
            setTimeout(spawnSunEmoji, i * 120);
        }
    });
}

/* ----------------------------------------------------------
   NOTE PARTICLES anchored to active vinyl disc
----------------------------------------------------------- */
function spawnNote() {
    if (bgm.paused) return;

    const notesContainer = document.getElementById("di-notes-container");
    if (!notesContainer) return;

    // Pick which vinyl is currently visible
    const activeVinyl = pillExpanded
        ? document.getElementById("di-vinyl-big")
        : document.getElementById("di-vinyl-compact");
    if (!activeVinyl) return;

    // Get positions relative to the pill (notes container parent)
    const pillRect  = diPill.getBoundingClientRect();
    const vinylRect = activeVinyl.getBoundingClientRect();

    // Center of the vinyl in pill-local coords
    const originX = (vinylRect.left - pillRect.left) + vinylRect.width  / 2;
    const originY = (vinylRect.top  - pillRect.top)  + vinylRect.height / 2;

    const note = document.createElement("div");
    note.className = "note-particle";

    const icons = ["♪", "♫", "♬", "♩", "𝄢"];
    note.textContent = icons[Math.floor(Math.random() * icons.length)];

    // Fly upward and outward from the disc
    const angleDeg = -20 - Math.random() * 140;
    const angleRad = angleDeg * (Math.PI / 180);
    const distance = 40 + Math.random() * 50;

    const tx = Math.cos(angleRad) * distance;
    const ty = Math.sin(angleRad) * distance;
    const rStart   = (Math.random() * 40  - 20)  + "deg";
    const rEnd     = (Math.random() * 180 - 90)  + "deg";
    const duration = (1.2 + Math.random() * 0.8) + "s";

    note.style.left = originX + "px";
    note.style.top  = originY + "px";
    note.style.setProperty('--tx',       `${tx}px`);
    note.style.setProperty('--ty',       `${ty}px`);
    note.style.setProperty('--rStart',   rStart);
    note.style.setProperty('--rEnd',     rEnd);
    note.style.setProperty('--duration', duration);

    notesContainer.appendChild(note);
    setTimeout(() => { note.remove(); }, parseFloat(duration) * 1000 + 100);
}
setInterval(spawnNote, 380);

// Blossoms Background
function spawnBlossom() {
    const blossom = document.createElement("div");
    blossom.className = "blossom";
    const emojis = ["🌸","🌷","🌼","🌺","🦋","🐝","🌿","🌱"];
    blossom.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    blossom.style.left = (Math.random() * window.innerWidth) + "px";
    blossom.style.top = "-50px";
    const duration = 4 + Math.random() * 5; 
    blossom.style.animation = `blossomFall ${duration}s linear forwards`;
    document.body.appendChild(blossom);
    setTimeout(() => { blossom.remove(); }, duration * 1000);
}
setInterval(() => {
    if (document.body.classList.contains('music-started')) {
        spawnBlossom();
    }
}, 1000);

// 3D Tilt
function init3DTilt() {
    const panel = document.querySelector('.info-panel');
    const container = document.querySelector('.tilt-container');
    if (!panel || !container) return;
    
    container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) / rect.width - 0.5;
        const mouseY = (e.clientY - rect.top) / rect.height - 0.5;
        panel.style.transform = `rotateY(${mouseX * 15}deg) rotateX(${-mouseY * 15}deg) translateZ(10px)`;
    });
    container.addEventListener('mouseleave', () => {
        panel.style.transform = 'rotateY(0deg) rotateX(0deg) translateZ(0px)';
    });
}
document.addEventListener('DOMContentLoaded', init3DTilt);

// Visualizer
const canvas = document.getElementById('canvasVisualizer');
const ctx = canvas.getContext('2d');
let rotation = 0;
const barCount = 64;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function animateVisualizer() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const logoEl = document.querySelector('.interactive-logo');
  
  if (logoEl) {
      const rect = logoEl.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const radius = rect.width / 2 + 10; 

      rotation += 0.005;

      for (let i = 0; i < barCount; i++) {
        const angle = (i * Math.PI * 2) / barCount + rotation;
        const x = centerX + Math.cos(angle) * radius;
        const y = centerY + Math.sin(angle) * radius;
        
        // Mock frequency data based on time
        const height = 20 + Math.sin(Date.now()/300 + i * 0.5) * 50;
        
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#4a90e2';
        ctx.fillStyle = '#73b7ff';
        ctx.fillRect(-3, 0, 6, height);
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.6;
        ctx.fillRect(-1, 0, 2, height * 0.8);
        ctx.restore();
      }
  }
  requestAnimationFrame(animateVisualizer);
}
document.addEventListener('DOMContentLoaded', animateVisualizer);

/* ----------------------------------------------------------
   FIREWORKS ENGINE
----------------------------------------------------------- */
const fwCanvas = document.getElementById('fireworksCanvas');
const fwCtx = fwCanvas.getContext('2d');
let fwWidth = window.innerWidth;
let fwHeight = window.innerHeight;
let fireworks = [];
let particles = [];
let fireworksActive = false;

window.addEventListener('resize', () => {
    fwWidth = window.innerWidth;
    fwHeight = window.innerHeight;
    fwCanvas.width = fwWidth;
    fwCanvas.height = fwHeight;
});
fwCanvas.width = fwWidth;
fwCanvas.height = fwHeight;

class Firework {
    constructor(tx, ty) {
        this.x = fwWidth / 2 + random(-200, 200); 
        this.y = fwHeight;
        this.tx = tx; 
        this.ty = ty; 
        this.distanceToTarget = Math.sqrt(Math.pow(tx - this.x, 2) + Math.pow(ty - this.y, 2));
        this.distanceTraveled = 0;
        this.coordinates = [];
        this.coordinateCount = 3;
        while(this.coordinateCount--) {
            this.coordinates.push([this.x, this.y]);
        }
        this.angle = Math.atan2(ty - this.y, tx - this.x);
        this.speed = 2;
        this.acceleration = 1.05;
        this.brightness = random(50, 70);
        this.hue = random(0, 360); 
    }

    update(index) {
        this.coordinates.pop();
        this.coordinates.unshift([this.x, this.y]);
        this.speed *= this.acceleration;
        const vx = Math.cos(this.angle) * this.speed;
        const vy = Math.sin(this.angle) * this.speed;
        this.distanceTraveled = Math.sqrt(Math.pow(this.x - this.tx + vx, 2) + Math.pow(this.y - this.ty + vy, 2)); 
        
        if (this.distanceTraveled < this.distanceToTarget && this.y > this.ty) {
             this.x += vx;
             this.y += vy;
        } else {
             createParticles(this.tx, this.ty, this.hue);
             fireworks.splice(index, 1);
        }
    }

    draw() {
        fwCtx.beginPath();
        fwCtx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
        fwCtx.lineTo(this.x, this.y);
        fwCtx.strokeStyle = 'hsl(' + this.hue + ', 100%, ' + this.brightness + '%)';
        fwCtx.stroke();
    }
}

class Particle {
    constructor(x, y, hue) {
        this.x = x;
        this.y = y;
        this.coordinates = [];
        this.coordinateCount = 5;
        while(this.coordinateCount--) {
            this.coordinates.push([this.x, this.y]);
        }
        this.angle = random(0, Math.PI * 2);
        this.speed = random(1, 10);
        this.friction = 0.95;
        this.gravity = 1;
        this.hue = random(hue - 20, hue + 20);
        this.brightness = random(50, 80);
        this.alpha = 1;
        this.decay = random(0.015, 0.03);
    }

    update(index) {
        this.coordinates.pop();
        this.coordinates.unshift([this.x, this.y]);
        this.speed *= this.friction;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed + this.gravity;
        this.alpha -= this.decay;

        if (this.alpha <= this.decay) {
            particles.splice(index, 1);
        }
    }

    draw() {
        fwCtx.beginPath();
        fwCtx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
        fwCtx.lineTo(this.x, this.y);
        fwCtx.strokeStyle = 'hsla(' + this.hue + ', 100%, ' + this.brightness + '%, ' + this.alpha + ')';
        fwCtx.stroke();
    }
}

function createParticles(x, y, hue) {
    let particleCount = 30;
    while(particleCount--) {
        particles.push(new Particle(x, y, hue));
    }
}

function loopFireworks() {
    if (!fireworksActive) return;

    requestAnimationFrame(loopFireworks);
    
    fwCtx.globalCompositeOperation = 'destination-out';
    fwCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    fwCtx.fillRect(0, 0, fwWidth, fwHeight);
    fwCtx.globalCompositeOperation = 'lighter';

    let i = fireworks.length;
    while(i--) {
        fireworks[i].draw();
        fireworks[i].update(i);
    }

    let j = particles.length;
    while(j--) {
        particles[j].draw();
        particles[j].update(j);
    }

    if (Math.random() < 0.05) { 
        fireworks.push(new Firework(random(0, fwWidth), random(0, fwHeight / 2)));
    }
}

function startFireworks() {
    if (!fireworksActive) {
        fireworksActive = true;
        loopFireworks();
    }
}

/* ----------------------------------------------------------
   COUNTDOWN & LOGIC
----------------------------------------------------------- */
function updateNewYearCountdown() {
    const now = new Date();
    const currentYear = now.getFullYear();
    
    // Check if today is June 1st
    const isJune1 = (now.getMonth() === 5 && now.getDate() === 1);

    const cdEl = document.getElementById("countdown");
    if (!cdEl) return;

    if (isJune1) {
        cdEl.textContent = "🌸 HAPPY JUNE 1ST! 🌸";
        cdEl.style.textShadow = "0 0 20px #ff00cc, 0 0 40px #00ffff"; 
        startFireworks();
        return;
    }

    let june1 = new Date(currentYear, 5, 1);
    if (now >= june1) {
        june1 = new Date(currentYear + 1, 5, 1);
    }
    const timeLeft = june1 - now;

    if (timeLeft <= 0) {
        cdEl.textContent = "🌸 HAPPY JUNE 1ST! 🌸";
        cdEl.style.textShadow = "0 0 20px #ff00cc, 0 0 40px #00ffff"; 
        startFireworks();
        return;
    }
    
    const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
    const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
    
    cdEl.textContent = `${days}д ${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
}

setInterval(updateNewYearCountdown, 1000);
updateNewYearCountdown();
