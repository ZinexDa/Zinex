<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zinex.lol</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="canvasVisualizer"></canvas>
<canvas id="fireworksCanvas"></canvas>


<div class="nav-tabs">
  <button class="action-btn" onclick="location.href='zinex.lol.html'">Главная</button>
  <a href="https://zeonix-launcher-site.vercel.app" target="_blank">
    <button class="action-btn">Zeonix Launcher</button>
</a>
</div>

<div class="main-content">
    
    <div class="tilt-container-logo">
        <img src="zinex.lol_files/zendex.png" class="logo interactive-logo" alt="Zendex Logo">
    </div>
    
    <h1>woooooooooooooooow</h1>

    <div class="tilt-container-timer">
        <div id="countdown-wrapper">
            <div id="countdown">00:00:00</div>
        </div>
    </div>

    <div class="tilt-container">
        <div class="info-panel">
            <div class="panel-header">
                <h2>Bio</h2>
            </div>
            <div class="panel-content">
                <div class="info-item">
                    <span class="label">Name:</span>
                    <span class="value">Zinex</span>
                </div>
                <div class="info-item">
                    <span class="label">My projects:</span>
                    <span class="value">Zeonix Launcher, </span>
                </div>
                <div class="info-item">
                    <span class="label">Languages:</span>
                    <span class="value">Lua, GodotScript, JS, Kotlin</span>
                </div>
                <div class="info-item">
                    <span class="label">Site:</span>
                    <span class="value">zinexda.github.io/Zinex</span>
                </div>
            </div>
            <div class="social-buttons">
                <a href="https://www.tiktok.com/@MS4wLjABAAAAFdLXg1ecsx-AwLS4skXMZxpD8ignWqoeMYw5Fh03V1RO62_YDqRYyrM3BtnQIcgi" target="_blank" class="social-btn">
                    <img src="zinex.lol_files/tiktok.png" alt="TikTok">
                </a>
                <a href="https://discord.com/users/1247751784139591701" target="_blank" class="social-btn">
                    <img src="zinex.lol_files/discord.png" alt="Discord">
                </a>
                <a href="https://github.com/ZinexDa" target="_blank" class="social-btn">
                    <img src="zinex.lol_files/github.png" alt="GitHub">
                </a>
            </div>
        </div>
    </div>

</div>

<img id="usagi" src="zinex.lol_files/zinex.gif" class="slide-down">

<div id="musicOverlay">
    <div class="music-content">
        <h1 style="animation: pulseText 2s infinite;">click to play music</h1>
    </div>
</div>

<audio id="bgm"></audio>

<!-- ===== DYNAMIC ISLAND PLAYER ===== -->
<div id="di-wrapper" class="hidden">
    <div id="di-pill">

        <!-- NOTE PARTICLES OVERLAY — always inside the pill, positioned over active vinyl -->
        <div id="di-notes-container"></div>

        <!-- COMPACT STATE -->
        <div id="di-compact">
            <div class="di-compact-left">
                <div class="di-vinyl" id="di-vinyl-compact"></div>
                <div class="di-track-compact" id="di-track-compact">Loading...</div>
            </div>
            <div class="di-eq" id="di-eq">
                <span></span><span></span><span></span><span></span>
            </div>
        </div>

        <!-- EXPANDED STATE -->
        <div id="di-expanded">
            <!-- Top: big vinyl + track + close -->
            <div class="di-exp-top">
                <div class="di-vinyl-big" id="di-vinyl-big"></div>
                <div class="di-track-info">
                    <div class="di-track-name" id="di-track-name">Loading...</div>
                    <div class="di-track-sub">zinex.lol</div>
                </div>
                <button class="di-close-btn" id="di-close-btn">✕</button>
            </div>

            <!-- Progress bar -->
            <div class="di-progress-row">
                <span class="di-time" id="di-current">0:00</span>
                <input class="di-range" type="range" id="di-progress" min="0" value="0" step="0.1">
                <span class="di-time" id="di-total">0:00</span>
            </div>

            <!-- Controls + volume -->
            <div class="di-controls-row">
                <div class="di-playback">
                    <button class="di-btn" id="di-prev" title="Previous">⏮</button>
                    <button class="di-btn play-pause" id="di-playpause">▶</button>
                    <button class="di-btn" id="di-next" title="Next">⏭</button>
                </div>
                <div class="di-volume-row">
                    <span class="di-vol-icon">🔈</span>
                    <input class="di-vol-slider" type="range" id="di-volume" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
