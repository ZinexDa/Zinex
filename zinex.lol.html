<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zinex.lol</title>

<style>
/* ---------------------- FONT ---------------------- */
@font-face {
    font-family: 'ContinuumMedium';
    src: url('ContinuumMedium.woff2') format('woff2'); 
    font-weight: normal;
    font-style: normal;
}

/* ---------------------- ANIMATED GRADIENT BACKGROUND ---------------------- */
@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ---------------------- GLOBAL ---------------------- */
body {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 25%, #0a1a1a 50%, #1a1a0a 75%, #0a0a0a 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    color: #fff;
    font-family: 'ContinuumMedium', sans-serif;
    text-align: center;
    padding-top: 40px;
    margin: 0;
    overflow-x: hidden;
    opacity: 0;
    animation: fadeIn 1.2s ease forwards, gradientShift 15s ease infinite;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

h1 {
    font-size: 48px;
    margin: 20px 0 10px 0;
    cursor: pointer;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    z-index: 10;
    position: relative;
}

/* ---------------------- 3D LOGO WITH LIQUID GLASS ---------------------- */
.interactive-logo {
    width: 250px;
    height: 250px; 
    max-width: 70%;
    margin-bottom: 15px;
    cursor: pointer;
    border-radius: 50%;
    object-fit: cover;
    will-change: transform;
    transition: all 0.3s ease;
    transform-style: preserve-3d;
    
    /* Liquid Glass Effect */
    border: 1px solid rgba(115, 183, 255, 0.3);
    box-shadow: 
        0 1px 8px rgba(0, 0, 0, 0.1),
        0 0 2px rgba(0, 0, 0, 0.1),
        inset 0 0 8px rgba(115, 183, 255, 0.15),
        inset 0 0 0 1px rgba(166, 166, 166, 0.2),
        inset -2px -2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 2px 2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.3);
    
    backdrop-filter: blur(6px) brightness(100%);
    -webkit-backdrop-filter: blur(6px) brightness(100%);
    padding: 8px; 
    background: linear-gradient(135deg, rgba(23, 23, 23, 0.6), rgba(23, 23, 23, 0.6)),
                linear-gradient(135deg, rgba(115, 183, 255, 0.15), rgba(140, 140, 140, 0.15));
    position: relative;
    z-index: 10;
}

.interactive-logo:hover {
    transform: translateY(-8px) scale(1.08) rotateY(10deg);
    box-shadow: 
        0 15px 50px rgba(115, 183, 255, 0.4),
        inset 0 0 30px rgba(115, 183, 255, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.3);
    border-color: rgba(74, 144, 226, 0.5);
}

.interactive-logo:active {
    transform: translateY(-2px) scale(0.98);
}

/* ---------------------- 3D COUNTDOWN WITH LIQUID GLASS ---------------------- */
#countdown-wrapper {
    position: relative;
    display: inline-block;
    perspective: 1000px;
    z-index: 10;
}

#countdown {
    font-size: 42px;
    letter-spacing: 3px;
    margin: 10px 0 30px 0;
    cursor: pointer;
    position: relative;
    text-shadow: 0 0 20px #ff00cc, 0 0 40px #ff0066;
    font-family: 'ContinuumMedium', monospace;
    color: #ffffff;
    padding: 15px 35px;
    border-radius: 100px;
    
    /* Liquid Glass Effect */
    overflow: hidden;
    box-shadow: 
        0 1px 8px rgba(0, 0, 0, 0.1),
        0 0 2px rgba(0, 0, 0, 0.1),
        inset 0 0 8px rgba(242, 242, 242, 0.1),
        inset 0 0 0 1px rgba(166, 166, 166, 0.2),
        inset -2px -2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 2px 2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.3);
    
    backdrop-filter: blur(6px) brightness(100%);
    -webkit-backdrop-filter: blur(6px) brightness(100%);
    background: linear-gradient(135deg, rgba(23, 23, 23, 0.7), rgba(23, 23, 23, 0.7)),
                linear-gradient(135deg, rgba(255, 0, 204, 0.15), rgba(140, 140, 140, 0.15));
    
    will-change: transform;
    transition: all 0.3s ease;
    transform-style: preserve-3d;
    border: 1px solid rgba(255, 0, 204, 0.3);
}

#countdown:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 
        0 10px 40px rgba(255, 0, 204, 0.4),
        inset 0 0 0 1px rgba(255, 255, 255, 0.3);
}

#countdown:active {
    transform: translateY(0px) scale(0.95);
}

#countdown::after {
    content: "🎄";
    position: absolute;
    right: -60px;
    top: -10px;
    font-size: 32px;
    animation: blossomFloat 3s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
}

@keyframes blossomFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* ---------------------- BACKGROUND FIGURES (BLOSSOMS) ---------------------- */
.blossom {
    position: fixed;
    font-size: 24px;
    pointer-events: none;
    z-index: 1;
    opacity: 0.8;
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.6));
}

@keyframes blossomFall {
    0%   { transform: translateY(-50px) rotate(0); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

/* ---------------------- LIQUID GLASS BUTTONS ---------------------- */
.nav-tabs {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 15px;
  z-index: 10000;
}

.action-btn {
    background: linear-gradient(135deg, rgba(23, 23, 23, 0.7), rgba(23, 23, 23, 0.7)),
                linear-gradient(135deg, rgba(115, 183, 255, 0.15), rgba(140, 140, 140, 0.15));
    backdrop-filter: blur(6px) brightness(100%);
    -webkit-backdrop-filter: blur(6px) brightness(100%);
    
    color: #fff;
    border: 1px solid rgba(115, 183, 255, 0.3);
    padding: 12px 24px;
    cursor: pointer;
    font-family: 'ContinuumMedium', sans-serif;
    font-size: 14px;
    border-radius: 100px;
    transition: all 0.3s ease;
    overflow: hidden;
    
    /* Liquid Glass Shadow */
    box-shadow: 
        0 1px 8px rgba(0, 0, 0, 0.1),
        0 0 2px rgba(0, 0, 0, 0.1),
        inset 0 0 8px rgba(242, 242, 242, 0.1),
        inset 0 0 0 1px rgba(166, 166, 166, 0.2),
        inset -2px -2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 2px 2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.3);
}

.action-btn:hover {
    transform: translateY(-3px);
    box-shadow: 
        0 5px 20px rgba(115, 183, 255, 0.4),
        inset 0 0 0 1px rgba(255, 255, 255, 0.3);
    background: linear-gradient(135deg, rgba(40, 40, 40, 0.8), rgba(40, 40, 40, 0.8)),
                linear-gradient(135deg, rgba(115, 183, 255, 0.25), rgba(140, 140, 140, 0.2));
    border-color: rgba(255, 255, 255, 0.4);
}

.action-btn:active {
    transform: translateY(-1px);
}

/* ---------------------- IMPROVED LIQUID GLASS PANEL ---------------------- */
.tilt-container {
    perspective: 1000px;
    margin: 40px auto;
    max-width: 500px;
    width: 90%;
    z-index: 10;
    position: relative;
}

.info-panel {
    background: linear-gradient(135deg, rgba(23, 23, 23, 0.6), rgba(23, 23, 23, 0.6)),
                linear-gradient(135deg, rgba(115, 183, 255, 0.1), rgba(140, 140, 140, 0.1));
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    padding: 30px;
    
    /* Enhanced Liquid Glass Shadow */
    box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.5),
        0 1px 8px rgba(0, 0, 0, 0.1),
        0 0 2px rgba(0, 0, 0, 0.1),
        inset 0 0 8px rgba(242, 242, 242, 0.08),
        inset 0 0 0 1px rgba(166, 166, 166, 0.15),
        inset -2px -2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 2px 2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.2);
    
    will-change: transform;
    transform-style: preserve-3d;
    transition: all 0.3s ease;
}

.panel-header h2 {
    color: #73b7ff;
    font-size: 26px;
    margin: 0 0 20px 0;
    text-shadow: 0 0 15px rgba(115, 183, 255, 0.6);
}

.info-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
}

.info-item:hover {
    background: rgba(255, 255, 255, 0.05);
    padding-left: 10px;
    padding-right: 10px;
    border-radius: 8px;
    transition: 0.3s;
}

.label { color: #ddd; font-weight: bold; }
.value { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.4); }

/* ---------------------- SOCIAL BUTTONS WITH LIQUID GLASS ---------------------- */
.social-buttons {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
}

.social-btn {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(23, 23, 23, 0.6), rgba(23, 23, 23, 0.6)),
                linear-gradient(135deg, rgba(115, 183, 255, 0.1), rgba(140, 140, 140, 0.1));
    backdrop-filter: blur(6px) brightness(100%);
    -webkit-backdrop-filter: blur(6px) brightness(100%);
    
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    border: 1px solid rgba(115, 183, 255, 0.3);
    
    /* Liquid Glass Shadow */
    box-shadow: 
        0 1px 8px rgba(0, 0, 0, 0.1),
        0 0 2px rgba(0, 0, 0, 0.1),
        inset 0 0 8px rgba(242, 242, 242, 0.1),
        inset 0 0 0 1px rgba(166, 166, 166, 0.2),
        inset -2px -2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 2px 2px 0.5px -2px rgba(38, 38, 38, 0.3),
        inset 3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.3);
}

.social-btn:hover {
    transform: translateY(-5px) scale(1.1);
    background: linear-gradient(135deg, rgba(115, 183, 255, 0.8), rgba(115, 183, 255, 0.8)),
                linear-gradient(135deg, rgba(140, 140, 140, 0.2), rgba(115, 183, 255, 0.2));
    box-shadow: 
        0 0 25px rgba(115, 183, 255, 0.9),
        inset 0 0 0 1px rgba(255, 255, 255, 0.4);
    border-color: rgba(255, 255, 255, 0.5);
}

.social-btn img {
    width: 22px;
    height: 22px;
    filter: brightness(0) invert(1);
}

/* ---------------------- USAGI & PEAM ---------------------- */
#usagi {
    position: fixed;
    bottom: -350px;
    right: 20px;
    width: 200px;
    z-index: 9999;
    transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}
.slide-up { transform: translateY(-350px); }
.slide-down { transform: translateY(350px); }

/* ---------------------- MUSIC OVERLAY ---------------------- */
#musicOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100000;
    cursor: pointer;
    transition: opacity 0.8s ease;
}

.music-content h1 {
    font-size: 2.5rem;
    animation: pulseText 2s ease-in-out infinite;
}

@keyframes pulseText {
    0%, 100% { opacity: 0.8; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 30px #ff00cc; }
}

body:not(.music-started) .main-content {
    opacity: 0.1;
    filter: blur(5px);
    pointer-events: none;
    transition: all 1s ease;
}

body.music-started .main-content {
    opacity: 1;
    filter: blur(0);
    pointer-events: all;
}

/* ---------------------- VISUALIZER ---------------------- */
#canvasVisualizer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 1;
}

/* ---------------------- RESPONSIVE DESIGN ---------------------- */

/* Tablets and small laptops (768px - 1024px) */
@media (max-width: 1024px) {
    body {
        padding-top: 30px;
    }
    
    h1 {
        font-size: 40px;
    }
    
    .interactive-logo {
        width: 220px;
        height: 220px;
    }
    
    #countdown {
        font-size: 36px;

@media (max-width: 480px) {

/* ---------------------- ПРОИГРЫВАТель ---------------------- */
#player-container {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: flex;
    align-items: center;
    width: 420px; 
    max-width: 90vw;
    background: linear-gradient(135deg, rgba(23, 23, 23, 0.9), rgba(40, 40, 40, 0.9));
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(115, 183, 255, 0.3);
    border-radius: 20px; 
    padding: 15px;
    z-index: 10001;
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    box-shadow: 
        0 10px 30px rgba(0,0,0,0.6), 
        inset 0 0 15px rgba(115,183,255,0.15);
}

.player-hidden { transform: translateX(-150%); opacity: 0; }

/* Диск с серым градиентом */
.cd-wrapper {
    position: relative;
    width: 70px; 
    height: 70px;
    flex-shrink: 0;
    margin-right: 20px;
}

.cd-disk {
    width: 100%;
    height: 100%;
    background: repeating-radial-gradient(
      #444 0, 
      #333 2px, 
      #444 4px
    );
    border-radius: 50%;
    border: 2px solid #73b7ff;
    box-shadow: 0 0 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
    position: relative;
}

/* Блик на диске для реалистичности */
.cd-disk::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.1) 100%);
    pointer-events: none;
}

/* Дырка в центре */
.cd-disk::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 18px; height: 18px;
    background: #1a1a1a;
    border-radius: 50%;
    border: 2px solid rgba(115, 183, 255, 0.5);
}

.rotating { animation: spin 4s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.player-controls {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex-grow: 1;
    gap: 6px;
    overflow: hidden; 
}

.track-info {
    font-size: 14px;
    color: #fff;
    text-shadow: 0 0 5px rgba(115,183,255,0.8);
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
}

/* Секция прогресс бара и времени */
.progress-section {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
}

.time-text {
    font-size: 10px;
    font-family: monospace;
    color: #bbb;
    min-width: 35px; 
}

/* Стилизация ползунков */
input[type=range] {
    -webkit-appearance: none;
    background: transparent;
    cursor: pointer;
}

/* Ползунок прогресса */
#progressSlider {
    flex-grow: 1;
    height: 4px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
}
#progressSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 10px;
    width: 10px;
    border-radius: 50%;
    background: #73b7ff;
    box-shadow: 0 0 5px #73b7ff;
    margin-top: -3px; 
}
#progressSlider::-webkit-slider-runnable-track {
    width: 100%;
    height: 4px;
}

/* Нижняя панель (кнопки + громкость) */
.bottom-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 5px;
}

.control-buttons { display: flex; gap: 15px; align-items: center; }

.player-btn {
    background: none;
    border: none;
    color: #ddd;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
    padding: 0;
}
.player-btn:hover { color: #73b7ff; transform: scale(1.2); text-shadow: 0 0 8px #73b7ff; }

.volume-wrapper {
    display: flex;
    align-items: center;
    gap: 5px;
}
#volumeSlider {
    width: 60px;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
}
#volumeSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 8px;
    width: 8px;
    border-radius: 50%;
    background: #fff;
    margin-top: -2px;
}

/* ---------------------- ПАРТИКЛЫ НОТ ---------------------- */
.note-particle {
    position: absolute;
    top: 50%;
    left: 50%;
    color: #73b7ff;
    font-size: 20px;
    font-family: "Segoe UI Emoji", sans-serif;
    pointer-events: none;
    z-index: -1;
    opacity: 0;
    
    text-shadow: 0 0 10px rgba(115, 183, 255, 0.8), 0 0 20px rgba(115, 183, 255, 0.4);
    
    animation: floatNote var(--duration) cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}

@keyframes floatNote {
    0% {
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
        opacity: 0;
    }
    10% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2) rotate(var(--rStart));
    }
    100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(var(--rEnd));
    }
}

/* ---------------------- САЛЮТ (FIREWORKS) ---------------------- */
#fireworksCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Чтобы можно было кликать сквозь салют */
    z-index: 2; /* Поверх фона, но под текстом */
}
</style>
</head>

<body>

<canvas id="canvasVisualizer"></canvas>
<canvas id="fireworksCanvas"></canvas>


<div class="nav-tabs">

<script>
/* ----------------------------------------------------------
   GLOBAL VARIABLES & SETUP
----------------------------------------------------------- */
const musicOverlay = document.getElementById("musicOverlay");
const bgm = document.getElementById("bgm");
const usagi = document.getElementById("usagi");
const progressSlider = document.getElementById("progressSlider");
const currentTimeEl = document.getElementById("currentTime");
const totalTimeEl = document.getElementById("totalTime");

const chirps = [
    new Audio("chirper1.ogg"),
    new Audio("chirper2.ogg"), 
    new Audio("chirper3.ogg")
];
chirps.forEach(c => { c.preload = "auto"; c.volume = 0.7; });

// Player variables
const songs = [
    { name: "iiSU", src: "zinex.lol_files/iiSU.mp3" },
    { name: "game", src: "zinex.lol_files/game.mp3" },
    { name: "Норм", src: "zinex.lol_files/Норм.mp3" }
];
let currentSongIndex = 0;
const playerContainer = document.getElementById("player-container");
const cdDisk = document.getElementById("cd-disk");
const trackNameDisplay = document.getElementById("current-track-name");
const playPauseBtn = document.getElementById("playPauseBtn");
const volumeSlider = document.getElementById("volumeSlider");

/* ----------------------------------------------------------
   HELPER FUNCTIONS
----------------------------------------------------------- */
function formatTime(seconds) {
    if (isNaN(seconds)) return "0:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

function random(min, max) { return Math.random() * (max - min) + min; }

/* ----------------------------------------------------------
   PLAYER LOGIC
----------------------------------------------------------- */
function loadTrack(index) {
    if (index < 0 || index >= songs.length) index = 0;
    const song = songs[index];
    bgm.src = song.src;
    trackNameDisplay.textContent = song.name;
    progressSlider.value = 0;
    currentTimeEl.textContent = "0:00";
    totalTimeEl.textContent = "..."; 
}

function togglePlay() {
    if (bgm.paused) {
        bgm.play();
        playPauseBtn.textContent = "⏸";
        cdDisk.classList.add("rotating");
    } else {
        bgm.pause();
        playPauseBtn.textContent = "▶";
        cdDisk.classList.remove("rotating");
    }
}

function nextTrack() {
    currentSongIndex = (currentSongIndex + 1) % songs.length;
    loadTrack(currentSongIndex);
    bgm.play();
    playPauseBtn.textContent = "⏸";
    cdDisk.classList.add("rotating");
}

function prevTrack() {
    currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
    loadTrack(currentSongIndex);
    bgm.play();
    playPauseBtn.textContent = "⏸";
    cdDisk.classList.add("rotating");
}

bgm.addEventListener('timeupdate', () => {
    if (document.activeElement !== progressSlider) {
        progressSlider.value = bgm.currentTime;
    }
    currentTimeEl.textContent = formatTime(bgm.currentTime);
});

bgm.addEventListener('loadedmetadata', () => {
    progressSlider.max = bgm.duration;
    totalTimeEl.textContent = formatTime(bgm.duration);
});

progressSlider.addEventListener('input', () => {
    currentTimeEl.textContent = formatTime(progressSlider.value);
    bgm.currentTime = progressSlider.value;
});

if (volumeSlider) {
    volumeSlider.addEventListener('input', (e) => {
        bgm.volume = e.target.value;
    });
}

// Start Experience
musicOverlay.addEventListener('click', function() {
    this.style.opacity = '0';
    this.style.pointerEvents = 'none';
    document.body.classList.add("music-started");
    
    if (playerContainer) {
        playerContainer.classList.remove("player-hidden");
    }

    loadTrack(currentSongIndex); 
    bgm.volume = 0.5;
    bgm.play().then(() => {
        if (cdDisk) cdDisk.classList.add("rotating");
        if (playPauseBtn) playPauseBtn.textContent = "⏸";
    }).catch(error => {
        console.log("Ошибка воспроизведения:", error);
    });
});

/* ----------------------------------------------------------
   USAGI & INTERACTION
----------------------------------------------------------- */
const logo = document.querySelector(".interactive-logo");
if (usagi && logo) {
    logo.addEventListener("click", function() {
        if (!document.body.classList.contains('music-started')) return;
        
        usagi.classList.remove("slide-down");
        usagi.classList.add("slide-up");

        const chirp = chirps[Math.floor(Math.random() * chirps.length)];
        chirp.currentTime = 0;
        chirp.play().catch(() => {});

        setTimeout(() => {
            usagi.classList.remove("slide-up");
            usagi.classList.add("slide-down");
        }, 4000);
    });
}

function spawnFallingPeam() {
    const img = document.createElement("img");
    img.src = "zinex.lol_files/peam.png";
    img.style.position = "fixed";
    img.style.width = "80px";
    img.style.left = (Math.random() * (window.innerWidth - 80)) + "px";
    img.style.top = "-120px";
    img.style.zIndex = 20000;
    img.style.opacity = "1";
    img.style.transition = "transform 2.2s ease-in, opacity 1s ease-in 1.5s";
    document.body.appendChild(img);

    requestAnimationFrame(() => {
        img.style.transform = `translateY(${window.innerHeight + 200}px) rotate(${Math.random()*60 - 30}deg)`;
        img.style.opacity = "0";
    });

    setTimeout(() => { img.remove(); }, 2500);
}

const cdWrapper = document.getElementById("countdown");
if (cdWrapper) {
    cdWrapper.addEventListener("click", (e) => {
        if (!document.body.classList.contains('music-started')) return;
        e.stopPropagation();
        const burst = 6 + Math.floor(Math.random() * 5);
        for (let i = 0; i < burst; i++) {
            setTimeout(spawnFallingPeam, i * 120);
        }
    });
}

/* ----------------------------------------------------------
   PARTICLES & VISUALS
----------------------------------------------------------- */
// Notes Particle Generator
function spawnNote() {
    if (bgm.paused || playerContainer.classList.contains("player-hidden")) return;
    
    const container = document.getElementById("notes-container");
    if (!container) return;

    const note = document.createElement("div");
    note.className = "note-particle";
    
    const icons = ["♪", "♫", "♬", "♩", "𝄢"];
    note.textContent = icons[Math.floor(Math.random() * icons.length)];

    const angleDeg = -30 - Math.random() * 120; 
    const angleRad = angleDeg * (Math.PI / 180);
    const distance = 60 + Math.random() * 60;

    const tx = Math.cos(angleRad) * distance;
    const ty = Math.sin(angleRad) * distance;
    const rStart = (Math.random() * 40 - 20) + "deg";
    const rEnd = (Math.random() * 180 - 90) + "deg";
    const duration = 1.5 + Math.random() * 1 + "s";

    note.style.setProperty('--tx', `${tx}px`);
    note.style.setProperty('--ty', `${ty}px`);
    note.style.setProperty('--rStart', rStart);
    note.style.setProperty('--rEnd', rEnd);
    note.style.setProperty('--duration', duration);

    container.appendChild(note);
    
    setTimeout(() => { note.remove(); }, parseFloat(duration) * 1000);
}
setInterval(spawnNote, 400);

// Blossoms Background
function spawnBlossom() {
    const blossom = document.createElement("div");
    blossom.className = "blossom";
    const emojis = ["⛄","🎄","🌨️","☃️","❄️","🎁","✨","🌟"];
    blossom.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    blossom.style.left = (Math.random() * window.innerWidth) + "px";
    blossom.style.top = "-50px";
    const duration = 4 + Math.random() * 5; 
    blossom.style.animation = `blossomFall ${duration}s linear forwards`;
    document.body.appendChild(blossom);
    setTimeout(() => { blossom.remove(); }, duration * 1000);
}
setInterval(() => {
    if (document.body.classList.contains('music-started')) {
        spawnBlossom();
    }
}, 1000);

// 3D Tilt
function init3DTilt() {
    const panel = document.querySelector('.info-panel');
    const container = document.querySelector('.tilt-container');
    if (!panel || !container) return;
    
    container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) / rect.width - 0.5;
        const mouseY = (e.clientY - rect.top) / rect.height - 0.5;
        panel.style.transform = `rotateY(${mouseX * 15}deg) rotateX(${-mouseY * 15}deg) translateZ(10px)`;
    });
    container.addEventListener('mouseleave', () => {
        panel.style.transform = 'rotateY(0deg) rotateX(0deg) translateZ(0px)';
    });
}
document.addEventListener('DOMContentLoaded', init3DTilt);

// Visualizer
const canvas = document.getElementById('canvasVisualizer');
const ctx = canvas.getContext('2d');
let rotation = 0;
const barCount = 64;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function animateVisualizer() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const logoEl = document.querySelector('.interactive-logo');
  
  if (logoEl) {
      const rect = logoEl.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const radius = rect.width / 2 + 10; 

      rotation += 0.005;

      for (let i = 0; i < barCount; i++) {
        const angle = (i * Math.PI * 2) / barCount + rotation;
        const x = centerX + Math.cos(angle) * radius;
        const y = centerY + Math.sin(angle) * radius;
        
        // Mock frequency data based on time
        const height = 20 + Math.sin(Date.now()/300 + i * 0.5) * 50;
        
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#4a90e2';
        ctx.fillStyle = '#73b7ff';
        ctx.fillRect(-3, 0, 6, height);
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.6;
        ctx.fillRect(-1, 0, 2, height * 0.8);
        ctx.restore();
      }
  }
  requestAnimationFrame(animateVisualizer);
}
document.addEventListener('DOMContentLoaded', animateVisualizer);

/* ----------------------------------------------------------
   FIREWORKS ENGINE
----------------------------------------------------------- */
const fwCanvas = document.getElementById('fireworksCanvas');
const fwCtx = fwCanvas.getContext('2d');
let fwWidth = window.innerWidth;
let fwHeight = window.innerHeight;
let fireworks = [];
let particles = [];
let fireworksActive = false;

window.addEventListener('resize', () => {
    fwWidth = window.innerWidth;
    fwHeight = window.innerHeight;
    fwCanvas.width = fwWidth;
    fwCanvas.height = fwHeight;
});
fwCanvas.width = fwWidth;
fwCanvas.height = fwHeight;

class Firework {
    constructor(tx, ty) {
        this.x = fwWidth / 2 + random(-200, 200); 
        this.y = fwHeight;
        this.tx = tx; 
        this.ty = ty; 
        this.distanceToTarget = Math.sqrt(Math.pow(tx - this.x, 2) + Math.pow(ty - this.y, 2));
        this.distanceTraveled = 0;
        this.coordinates = [];
        this.coordinateCount = 3;
        while(this.coordinateCount--) {
            this.coordinates.push([this.x, this.y]);
        }
        this.angle = Math.atan2(ty - this.y, tx - this.x);
        this.speed = 2;
        this.acceleration = 1.05;
        this.brightness = random(50, 70);
        this.hue = random(0, 360); 
    }

    update(index) {
        this.coordinates.pop();
        this.coordinates.unshift([this.x, this.y]);
        this.speed *= this.acceleration;
        const vx = Math.cos(this.angle) * this.speed;
        const vy = Math.sin(this.angle) * this.speed;
        this.distanceTraveled = Math.sqrt(Math.pow(this.x - this.tx + vx, 2) + Math.pow(this.y - this.ty + vy, 2)); 
        
        if (this.distanceTraveled < this.distanceToTarget && this.y > this.ty) {
             this.x += vx;
             this.y += vy;
        } else {
             createParticles(this.tx, this.ty, this.hue);
             fireworks.splice(index, 1);
        }
    }

    draw() {
        fwCtx.beginPath();
        fwCtx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
        fwCtx.lineTo(this.x, this.y);
        fwCtx.strokeStyle = 'hsl(' + this.hue + ', 100%, ' + this.brightness + '%)';
        fwCtx.stroke();
    }
}

class Particle {
    constructor(x, y, hue) {
        this.x = x;
        this.y = y;
        this.coordinates = [];
        this.coordinateCount = 5;
        while(this.coordinateCount--) {
            this.coordinates.push([this.x, this.y]);
        }
        this.angle = random(0, Math.PI * 2);
        this.speed = random(1, 10);
        this.friction = 0.95;
        this.gravity = 1;
        this.hue = random(hue - 20, hue + 20);
        this.brightness = random(50, 80);
        this.alpha = 1;
        this.decay = random(0.015, 0.03);
    }

    update(index) {
        this.coordinates.pop();
        this.coordinates.unshift([this.x, this.y]);
        this.speed *= this.friction;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed + this.gravity;
        this.alpha -= this.decay;

        if (this.alpha <= this.decay) {
            particles.splice(index, 1);
        }
    }

    draw() {
        fwCtx.beginPath();
        fwCtx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
        fwCtx.lineTo(this.x, this.y);
        fwCtx.strokeStyle = 'hsla(' + this.hue + ', 100%, ' + this.brightness + '%, ' + this.alpha + ')';
        fwCtx.stroke();
    }
}

function createParticles(x, y, hue) {
    let particleCount = 30;
    while(particleCount--) {
        particles.push(new Particle(x, y, hue));
    }
}

function loopFireworks() {
    if (!fireworksActive) return;

    requestAnimationFrame(loopFireworks);
    
    fwCtx.globalCompositeOperation = 'destination-out';
    fwCtx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    fwCtx.fillRect(0, 0, fwWidth, fwHeight);
    fwCtx.globalCompositeOperation = 'lighter';

    let i = fireworks.length;
    while(i--) {
        fireworks[i].draw();
        fireworks[i].update(i);
    }

    let j = particles.length;
    while(j--) {
        particles[j].draw();
        particles[j].update(j);
    }

    if (Math.random() < 0.05) { 
        fireworks.push(new Firework(random(0, fwWidth), random(0, fwHeight / 2)));
    }
}

function startFireworks() {
    if (!fireworksActive) {
        fireworksActive = true;
        loopFireworks();
    }
}

/* ----------------------------------------------------------
   COUNTDOWN & LOGIC
----------------------------------------------------------- */
function updateNewYearCountdown() {
    const now = new Date();
    const currentYear = now.getFullYear();
    
    // Check if today is Jan 1st
    const isJan1 = (now.getMonth() === 0 && now.getDate() === 1);

    const cdEl = document.getElementById("countdown");
    if (!cdEl) return;

    if (isJan1) {
        cdEl.textContent = "🎉 HAPPY NEW YEAR! 🎉";
        cdEl.style.textShadow = "0 0 20px #ff00cc, 0 0 40px #00ffff"; 
        startFireworks();
        return;
    }

    const newYear = new Date(currentYear + 1, 0, 1);
    const timeLeft = newYear - now;

    if (timeLeft <= 0) {
        cdEl.textContent = "🎉 HAPPY NEW YEAR! 🎉";
        cdEl.style.textShadow = "0 0 20px #ff00cc, 0 0 40px #00ffff"; 
        startFireworks();
        return;
    }
    
    const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
    const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
    
    cdEl.textContent = `${days}д ${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
}

setInterval(updateNewYearCountdown, 1000);
updateNewYearCountdown();
</script>
